components:
  schemas:
    ActiveSessionsDTO:
      type: object
      properties:
        activeSessions:
          type: integer
          description: Number of active sessions
          format: int32
    ExecutePixelForm:
      required:
      - pixel
      type: object
      properties:
        pixel:
          type: string
          description: Pixel expression to execute
    InsightIdForm:
      required:
      - insightId
      type: object
      properties:
        insightId:
          type: string
          description: Insight identifier
    JobIdRequest:
      required:
      - jobId
      type: object
      properties:
        jobId:
          type: string
          description: Asynchronous job identifier
    LegacyUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation succeeded
    LoginProviderDTO:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether this provider is enabled
        loginUrl:
          type: string
          description: Login URL for redirection
        name:
          type: string
          description: Provider display name
          example: Google
        type:
          type: string
          description: Provider key
          example: google
    RunPixelRequest:
      required:
      - expression
      type: object
      properties:
        dropLogging:
          type: boolean
          description: "If true, drop console logging after run"
          example: true
        expression:
          type: string
          description: Pixel expression to execute
          example: Connect(engine:'mydb');
        insightId:
          type: string
          description: Insight identifier. Use 'new' to create a new insight or omit
            for temporary.
          example: bf235853-86b7-483f-a0a5-ae489bfed97b
        tz:
          type: string
          description: Client timezone ID
          example: America/New_York
    SearchInsightsForm:
      type: object
      properties:
        filterData:
          type: string
          description: JSON-encoded filters including app_id and tags
        limit:
          type: string
          description: Limit for pagination
          example: "15"
        offset:
          type: string
          description: Offset for pagination
          example: "0"
        searchString:
          type: string
          description: Search string
    UserInfoDTO:
      type: object
      properties:
        email:
          type: string
          description: Email address
        id:
          type: string
          description: User identifier
        name:
          type: string
          description: Display name
        permissions:
          type: array
          description: List of permissions
          items:
            type: string
            description: List of permissions
        type:
          type: string
          description: User type
          enum:
          - admin
          - user
          - api
