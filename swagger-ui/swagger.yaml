openapi: 3.0.1
info:
  title: SEMOSS
  version: 0.0.1-SNAPSHOT
servers:
- url: https://workshop.cfg.deloitte.com/cfg-ai-demo/Monolith/api
  description: Demo Endpoint URL
- url: http://localhost:8080/Monolith/api
  description: Local Development
tags:
- name: API
  description: API for querying insights
- name: Authorization
  description: Authorization and user search APIs
- name: Database Engine
  description: "LEGACY endpoints for database operations. Deprecated: use /e-{engineId}\
    \ or /database-{databaseId} endpoints instead."
- name: Engine Execution
  description: " Executes a Pixel (SEMOSS scripting language) command. Pixels are\
    \ used for data processing, analytics, and workflow automation in SEMOSS."
- name: AI Models
  description: AI and machine learning model operations
- name: Scheduler
  description: Execute Pixel in scheduler context.
- name: Session
  description: Session management and cleanup
- name: Authentication
  description: User authentication and session management
- name: auth
  description: "Endpoints for managing authentication and authorization of users and\
    \ applications, including user permissions, access control, and administrative\
    \ actions."
paths:
  /app-{databaseId}/appImage/download:
    get:
      tags:
      - Database Engine
      summary: Download database image (legacy)
      description: "Downloads the database image for the specified database. Deprecated:\
        \ use /e-{engineId}/image/download."
      operationId: imageDownload_1
      parameters:
      - name: databaseId
        in: path
        description: Database identifier
        required: true
        schema:
          type: string
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Image downloaded
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/svg+xml:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request
          content:
            application/json: {}
        "401":
          description: Unauthorized
          content:
            application/json: {}
      deprecated: true
      security:
      - basicAuth: []
  /app-{databaseId}/updateSmssFile:
    post:
      tags:
      - Database Engine
      summary: Update database SMSS file (legacy)
      description: "Updates the SMSS configuration file for the specified database.\
        \ Deprecated: use /database-{databaseId} or /e-{engineId} equivalent."
      operationId: updateSmssFile_1
      parameters:
      - name: databaseId
        in: path
        description: Database identifier
        required: true
        schema:
          type: string
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: SMSS file updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyUpdateResponse'
        "400":
          description: Bad request
          content:
            application/json: {}
        "401":
          description: Unauthorized
          content:
            application/json: {}
      deprecated: true
      security:
      - basicAuth: []
