name: Build monolith
on:
  push:
    branches:
      - dev
      - main
      - openam-tomcat-upgrade
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "-s ./settings.xml --batch-mode"
  IMAGE: "registry.gitlab.com/finestructure/pipeline-trigger:2.9.0"
  MAVEN_REPO_TOKEN: ${{ vars.MAVEN_REPO_TOKEN }}
  MAVEN_REPO_TOKEN_PASS: ${{ vars.MAVEN_REPO_TOKEN_PASS }}
  MAVEN_CENTRAL_PORTAL_REPO_USERNAME: ${{ vars.MAVEN_CENTRAL_PORTAL_REPO_USERNAME }}
  MAVEN_CENTRAL_PORTAL_REPO_PASSWORD: ${{ vars.MAVEN_CENTRAL_PORTAL_REPO_PASSWORD }}
  GPG_PASS_PHRASE: ${{ secrets.GPG_PASS_PHRASE }}
  MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASS_PHRASE }}
  RELEASE: ${{ vars.RELEASE }}
  
jobs:
  build_semoss:
    runs-on: codebuild-semoss-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
    if: ${{ vars.RELEASE != 'TRUE' }}
    container:
      image: public.ecr.aws/docker/library/maven:3.9.9-amazoncorretto-21-debian
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get current timestamp
        id: timestamp
        run: echo "TIMESTAMP=$(date +%s)" >> $GITHUB_ENV
      - name: list workspace contents
        run: |
          ls -lah
          pwd
      - name: Build Semoss Workflow Dispatch
        uses: the-actions-org/workflow-dispatch@v4
        with:
          workflow: dev_workflow.yml
          repo: SEMOSS/Semoss
          ref: dev
          token: ${{ secrets.SEMOSS_GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-interval: 15s

  build_monolith_dev:
    needs: build_semoss
    runs-on: codebuild-semoss-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
    if: ${{ vars.RELEASE != 'TRUE'  && (github.event_name =='push' || github.event_name =='pull_request')  }}
    container:
      image: public.ecr.aws/docker/library/maven:3.9.9-amazoncorretto-21-debian
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Set up JDK 8
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: "adopt"
      #     java-version: "8"

      - name: Update and install openjfx
        run: |
          rm -rf /var/lib/apt/lists/*
          apt-get update -y
          apt-get install -y openjfx

      - name: Clear Maven repository
        run: rm -rf .m2/repository/org/semoss

      - name: Build with Maven
        run: /usr/share/maven/bin/mvn $MAVEN_CLI_OPTS clean install -Dci.version=${{ vars.VERSION }}-SNAPSHOT

      - name: Clear Maven repository after build
        run: rm -rf .m2/repository/org/semoss

    #   - name: Upload artifact
    #     uses: actions/upload-artifact@v4
    #     with:
    #       name: monolith-${{ vars.VERSION }}-SNAPSHOT.war
    #       path: target/monolith-${{ vars.VERSION }}-SNAPSHOT.war

  build_monolith_deploy:
    needs: build_semoss
    runs-on: codebuild-semoss-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: public.ecr.aws/docker/library/maven:3.9.9-amazoncorretto-21-debian
    if: ${{ vars.RELEASE != 'TRUE'  && github.event_name =='workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Set up JDK 8
      #   uses: actions/setup-java@v3
      #   with:
      #     java-version: "8"

      - name: Install dependencies
        run: |
          apt-get --allow-releaseinfo-change update -y
          apt-get update -y
          apt-get install -y openjfx
          apt-get install -y gnupg2
      - name: Configure GPG (loopback)
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent || true
      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY_2 }}" | gpg --batch --import
      - name: Refresh keys
        run: |
          echo "keyserver keyserver.ubuntu.com" > ~/.gnupg/gpg.conf
          #gpg2 --refresh-key
          gpg --list-keys

      - name: Clear Maven repository
        run: rm -rf .m2/repository/org/semoss

      - name: Deploy with Maven
        run: |
            /usr/share/maven/bin/mvn $MAVEN_CLI_OPTS versions:set-property -Dproperty=ci.version -DnewVersion=${{ vars.VERSION }}-SNAPSHOT -DgenerateBackupPoms=false
            /usr/share/maven/bin/mvn $MAVEN_CLI_OPTS deploy -P deploy -Dmaven.test.skip=${{ vars.SKIP_TESTS }}
     
      - name: Clear Maven repository after deploy
        run: rm -rf .m2/repository/org/semoss

    #   - name: Upload artifacts
    #     uses: actions/upload-artifact@v4
    #     with:
    #       name: monolith-${{ vars.VERSION }}-SNAPSHOT.war
    #       path: target/monolith-${{ vars.VERSION }}-SNAPSHOT.war

  build_monolith_release:
    runs-on: codebuild-semoss-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: public.ecr.aws/docker/library/maven:3.9.9-amazoncorretto-21-debian
    if: ${{ vars.RELEASE == 'TRUE' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get --allow-releaseinfo-change update -y
          apt-get update -y
          apt-get install -y openjfx
          apt-get install -y gnupg2
      - name: Configure GPG (loopback)
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent || true
      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY_2 }}" | gpg --batch --import
      - name: Refresh keys
        run: |
          echo "keyserver keyserver.ubuntu.com" > ~/.gnupg/gpg.conf
          #gpg2 --refresh-key
          gpg --list-keys

      - name: Clear Maven repository
        run: rm -rf .m2/repository/org/semoss

      - name: Release with Maven
        run: |
            /usr/share/maven/bin/mvn $MAVEN_CLI_OPTS versions:set-property -Dproperty=ci.version -DnewVersion=${{ vars.VERSION }} -DgenerateBackupPoms=false
            /usr/share/maven/bin/mvn $MAVEN_CLI_OPTS deploy -P deploy -Dmaven.test.skip=${{ vars.SKIP_TESTS }}
     
      - name: Clear Maven repository after release
        run: rm -rf .m2/repository/org/semoss

      # - name: Upload artifacts
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: monolith-${{ vars.VERSION }}.war
      #     path: target/monolith-${{ vars.VERSION }}.war
