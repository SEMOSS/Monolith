<!DOCTYPE html>
<html lang="en" xml:lang="en">
	<head>
		<title>SAML Login</title>
		<script>
			function redirectSAML() {
				// Only sibling endpoints are valid; never derive a destination from query/fragment text.
				if (window.location.pathname.endsWith('/samlLogin')) {
					window.location.replace('./IdpSSOServlet');
				} else {
					var trailingSlashes = window.location.pathname.match(/\/+$/);
					var levels = trailingSlashes ? trailingSlashes[0].length : 1;
					window.location.replace('../'.repeat(levels) + 'IdpSSOServlet');
				}
			}
		</script>
	</head>

	<body onload="redirectSAML()">
	</body>
</html>
