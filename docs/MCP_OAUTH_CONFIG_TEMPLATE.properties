# MCP OAuth Configuration Template for social.properties
# Copy the relevant sections to your social.properties file and update with your credentials

# =============================================================================
# ENABLED LOGINS - Add your OAuth providers here
# =============================================================================
logins_allowed=google,github,microsoft

# =============================================================================
# GOOGLE OAUTH CONFIGURATION
# =============================================================================
google_client_id=YOUR_GOOGLE_CLIENT_ID
google_secret_key=YOUR_GOOGLE_CLIENT_SECRET
google_redirect_uri=https://yourdomain.com/Monolith/api/ext/mcp/{toolbox_id}/oauth/callback/google
google_auth_url=https://accounts.google.com/o/oauth2/v2/auth
google_token_url=https://oauth2.googleapis.com/token
google_userinfo_url=https://www.googleapis.com/oauth2/v3/userinfo
google_scope=openid email profile
google_beanProps=name,sub,email
google_jsonPattern=
google_auto_add=true
google_sanitizeUserResponse=false

# =============================================================================
# GITHUB OAUTH CONFIGURATION
# =============================================================================
github_client_id=YOUR_GITHUB_CLIENT_ID
github_secret_key=YOUR_GITHUB_CLIENT_SECRET
github_redirect_uri=https://yourdomain.com/Monolith/api/ext/mcp/{toolbox_id}/oauth/callback/github
github_auth_url=https://github.com/login/oauth/authorize
github_token_url=https://github.com/login/oauth/access_token
github_userinfo_url=https://api.github.com/user
github_scope=read:user user:email
github_beanProps=name,id,email
github_jsonPattern=
github_auto_add=true
github_sanitizeUserResponse=false

# =============================================================================
# MICROSOFT OAUTH CONFIGURATION
# =============================================================================
microsoft_client_id=YOUR_MICROSOFT_CLIENT_ID
microsoft_secret_key=YOUR_MICROSOFT_CLIENT_SECRET
microsoft_redirect_uri=https://yourdomain.com/Monolith/api/ext/mcp/{toolbox_id}/oauth/callback/microsoft
microsoft_auth_url=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
microsoft_token_url=https://login.microsoftonline.com/common/oauth2/v2.0/token
microsoft_userinfo_url=https://graph.microsoft.com/v1.0/me
microsoft_scope=openid email profile User.Read
microsoft_beanProps=displayName,id,mail
microsoft_jsonPattern=
microsoft_auto_add=true
microsoft_sanitizeUserResponse=false

# =============================================================================
# OKTA OAUTH CONFIGURATION (if using Okta)
# =============================================================================
okta_client_id=YOUR_OKTA_CLIENT_ID
okta_secret_key=YOUR_OKTA_CLIENT_SECRET
okta_redirect_uri=https://yourdomain.com/Monolith/api/ext/mcp/{toolbox_id}/oauth/callback/okta
okta_auth_url=https://your-domain.okta.com/oauth2/default/v1/authorize
okta_token_url=https://your-domain.okta.com/oauth2/default/v1/token
okta_userinfo_url=https://your-domain.okta.com/oauth2/default/v1/userinfo
okta_scope=openid email profile
okta_beanProps=name,sub,email
okta_jsonPattern=
okta_auto_add=true
okta_sanitizeUserResponse=false

# =============================================================================
# NOTES:
# =============================================================================
# 1. Replace {toolbox_id} with your actual toolbox/engine ID in the redirect_uri
# 2. Replace YOUR_*_CLIENT_ID and YOUR_*_CLIENT_SECRET with actual values from OAuth provider
# 3. Replace "yourdomain.com" with your actual domain
# 4. For Okta, replace "your-domain" with your Okta domain
# 5. Set auto_add=true to automatically add users to SEMOSS on first login
# 6. The beanProps field maps OAuth provider response fields to SEMOSS user properties
# 7. Use jsonPattern if you need to extract nested JSON fields (JMESPath syntax)

